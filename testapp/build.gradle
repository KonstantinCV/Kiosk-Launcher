// Test-only target app for the e2e suite in e2e/. It stands in for the app the loader keeps
// running (a Headjack app on a real headset) and can be told over adb to exit or crash.
// Never shipped: only debug variants are built. No library dependencies, so it builds fast.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.osamaalek.kiosklauncher.testapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.osamaalek.kiosklauncher.testapp"
        minSdk 29
        // Same as the loader: Meta Horizon OS is built on Android 14 (API 34)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The same app twice, installable side by side. Intent filters and labels are in src/<flavor>.
    //   launcher: a regular app (MAIN + LAUNCHER), found by getLaunchIntentForPackage()
    //   vr:       a Quest VR app (MAIN + com.oculus.intent.category.VR only), which the loader
    //             can only start through its VR fallback in TargetLauncher
    flavorDimensions = ['category']
    productFlavors {
        launcher {
            dimension 'category'
        }
        vr {
            dimension 'category'
            applicationIdSuffix '.vr'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        variantBuilder.enable = false
    }
}
