name: Build Android App

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_package:
        description: 'Package the loader starts before one is picked on the headset (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    - name: Unit tests and debug build
      env:
        TARGET_PACKAGE: ${{ github.event.inputs.target_package }}
      run: ./gradlew testDebugUnitTest assembleDebug -PloaderTargetPackage="$TARGET_PACKAGE"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
