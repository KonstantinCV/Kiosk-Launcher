plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Package the loader starts on first boot, before anyone picks an app on the headset.
// Pass it at build time: ./gradlew assembleRelease -PloaderTargetPackage=com.example.headjackapp
def loaderTargetPackage = project.findProperty('loaderTargetPackage') ?: ''

android {
    namespace 'com.osamaalek.kiosklauncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.osamaalek.kiosklauncher"
        minSdk 29
        // Meta Horizon OS is built on Android 14 (API 34)
        targetSdk 34
        versionCode 2
        versionName "2.0"

        buildConfigField "String", "DEFAULT_TARGET_PACKAGE", "\"${loaderTargetPackage}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
